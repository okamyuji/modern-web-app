name: Docker (10-deployment)

on:
  pull_request:
    paths:
      - "10-deployment/**"
      - ".github/workflows/docker-10-deployment.yml"
  push:
    branches: [main]
    paths:
      - "10-deployment/**"
      - ".github/workflows/docker-10-deployment.yml"

permissions:
  contents: read

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --build-arg VERSION=${{ github.sha }} -t deployment-demo:ci 10-deployment

      - name: Generate API token
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "API_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Run container
        run: |
          docker run -d --name app -p 8080:8080 \
            -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -e CSRF_SECRET="$(openssl rand -hex 16)" \
            -e API_TOKEN="$API_TOKEN" \
            deployment-demo:ci

      - name: Wait for healthy
        run: |
          for _ in $(seq 45); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && exit 0
            [ "$(docker inspect -f '{{.State.Running}}' app)" = true ] || exit 1
            sleep 2
          done
          exit 1

      - name: Check endpoints
        run: |
          curl -fsS http://localhost:8080/health
          curl -fsS -o /dev/null http://localhost:8080/static/css/app.css
          curl -fsS -o /dev/null -X POST -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $API_TOKEN" \
            -d '{"title":"ci"}' http://localhost:8080/api/todos
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/todos)" = 401

      - name: Container logs
        if: always()
        run: docker logs app || true
